# Local pilot only. Interactive CLI processes run on the Windows or Linux host.
# docker compose -f docker-compose.yml -f docker-compose.terminal.yml up -d app
# See infra/claude-terminal/README.md before enabling; never use on a public unit.
services:
  app:
    # Docker Desktop defines host.docker.internal already; on Linux Engine this
    # maps it to the host's Docker bridge gateway (docker0, usually 172.17.0.1).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLAUDE_TERMINAL_URL: ${CLAUDE_TERMINAL_URL:-http://host.docker.internal:3015}
      CLAUDE_TERMINAL_SECRET: ${CLAUDE_TERMINAL_SECRET:?Configure the local bridge secret}
      CLAUDE_TERMINAL_USER_ID: ${CLAUDE_TERMINAL_USER_ID:?Configure the authorized user ID}
      CODEX_TERMINAL_URL: ${CODEX_TERMINAL_URL:-}
      CODEX_TERMINAL_SECRET: ${CODEX_TERMINAL_SECRET:-}
      CODEX_TERMINAL_USER_ID: ${CODEX_TERMINAL_USER_ID:-}
