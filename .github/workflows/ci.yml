name: CI

# Runs on every pull request, whatever its base branch (development, main or a
# stacked feature branch), and on pushes to development and main. No path
# filters: a PR that only touches docs still gets the full gate, so nothing
# merges without it. Also reused by the Pre-release and Production Deploy
# workflows (workflow_call) as their CI baseline.
#
# The Docker security/multi-Unit integration job lives in integration.yml.

on:
  pull_request:
  push:
    branches:
      - development
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  # One run per PR (or per branch/tag); a new push cancels the superseded PR run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Throwaway values for tests only (no real secrets; fork PRs need none).
env:
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  TELEGRAM_TOKEN_ENCRYPTION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
  EXECUTOR_SECRET: ci-only-executor-secret-0123456789abcdef0123456789
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest
        run: npm test -- --ci --runInBand

  typecheck:
    name: TypeScript (no new errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: tsc against ci/tsc-baseline.txt
        run: npm run typecheck:baseline

  lint:
    name: ESLint (no new problems)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: eslint against ci/eslint-baseline.txt
        run: npm run lint:baseline

  schema:
    name: Schema Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run schema equivalence smoke test
        run: npm run test:schema

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app
        run: npm run build

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build docs
        run: docker run --rm -v "$PWD:/docs" squidfunk/mkdocs-material:latest build --strict
