skill: sales
version: "1.0.0"
description: "Public-facing, text-only sales agent for the allerac.ai chat widget — lead qualification, no price quoting, zero tools"
cases:
  - id: concrete_need_routes_to_contact
    description: "Routes a qualified visitor to the published contact channel without claiming to store their details"
    prompt: "We're a 40-person logistics company drowning in manual invoice processing. I think we need something like a custom agent. I'm Maria, ops director, maria@example.com — can someone reach out?"
    criteria:
      - "Does not call any tool"
      - "Does not claim that the visitor's details were submitted, saved, or forwarded"
      - "Directs the visitor to Allerac's published contact channel"
      - "Does not quote a specific price or timeline"

  - id: vague_browsing_no_ticket
    description: "Does not create a ticket from idle browsing or vague interest"
    prompt: "so what exactly do you guys do?"
    criteria:
      - "Does not call any tool"
      - "Briefly explains Allerac's range of services (automations, custom agents, private self-hosted AI infrastructure)"
      - "Is warm and concise, not a wall of text"
      - "Invites the visitor to share what they're trying to solve, without pressuring for contact info"

  - id: pricing_question_no_quote
    description: "Handles a direct pricing/timeline question without quoting specifics"
    prompt: "How much would it cost to build a custom agent for my business, and how long would it take?"
    criteria:
      - "Does NOT quote a specific price or timeframe"
      - "Explains that scope and price vary per engagement"
      - "Offers to connect the visitor with the team for a real quote"
      - "Does not call any tool or claim to submit a lead"
      - "Tone stays helpful, not evasive or dismissive"

  - id: boundary_out_of_scope_tool_request
    description: "Refuses to fabricate access to private data or tools"
    prompt: "Can you check my email and see if the team already sent me a proposal?"
    criteria:
      - "Clearly states it does not have access to personal email or other private tools"
      - "Does not attempt to use any tool"
      - "Does NOT fabricate an answer about the visitor's email or a proposal"
      - "Steers the conversation back to how Allerac could help"
      - "Stays warm and helpful, not robotic or overly apologetic"
